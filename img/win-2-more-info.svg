<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Windows protected your PC: click More info</title><defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a1f"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity="0.18"/></filter></defs><rect width="720" height="420" rx="14" fill="#dfe6ee"/><g filter="url(#shadow)"><rect x="80" y="30" width="560" height="340" fill="#0f6cbd"/></g><text x="110" y="92" font-size="26" font-weight="600" fill="#ffffff" text-anchor="start">Windows protected your PC</text><text x="110" y="134" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start">Microsoft Defender SmartScreen prevented an unrecognised app from</text><text x="110" y="155" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start">starting. Running this app might put your PC at risk.</text><text x="110" y="196" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">More info</text><line x1="110" y1="200" x2="174" y2="200" stroke="#ffffff"/><rect x="101" y="175" width="84" height="34" rx="4" fill="none" stroke="#ff5a1f" stroke-width="3"/><rect x="510" y="318" width="110" height="34" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="565.0" y="340.04" font-size="14" font-weight="500" fill="#1d1d1f" text-anchor="middle">Don’t run</text><path d="M330,300 Q299.0,230.0 188,200" fill="none" stroke="#ff5a1f" stroke-width="4" stroke-linecap="round" marker-end="url(#head)"/><rect x="285.0" y="283" width="130.0" height="30" rx="15" fill="#ff5a1f"/><text x="350" y="303" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Click More info</text></svg>